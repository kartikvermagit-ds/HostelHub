# Netlify Configuration for HostelHub Frontend

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Single Page Application Redirects (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
